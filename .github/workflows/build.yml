name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkgconf fonts-dejavu-core \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxinerama-dev libxkbcommon-dev xvfb xauth xdotool imagemagick tesseract-ocr tesseract-ocr-eng fzf python3-tk
      - run: cmake --preset linux-gui
      - run: cmake --build --preset linux-gui --parallel
      - run: ctest --preset linux-gui --output-on-failure
      - run: |
          SDL_VIDEO_DRIVER=x11 xvfb-run -a .local/build/linux-gui/termole \
            --test-render .local/build/linux-gui/termole-x11.bmp

      - name: Standalone X11 window scenarios
        run: |
          status=0
          for scenario in startup clipboard fzf_resize fzf_escape close; do
            xvfb-run -a timeout 120 sh "tests/visual/posix_${scenario}_x11.sh" \
              .local/build/linux-gui/termole ".local/build/linux-gui/standalone/$scenario" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-standalone
          include-hidden-files: true
          path: .local/build/linux-gui/standalone/

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset macos-static
      - run: cmake --build --preset macos-static --parallel
      - run: ctest --preset macos-static --output-on-failure
      - run: |
          SDL_VIDEO_DRIVER=cocoa .local/build/macos-static/termole \
            --test-render .local/build/macos-static/termole-cocoa.bmp
      - run: command -v fzf || brew install fzf
      - name: Standalone Cocoa window scenarios
        timeout-minutes: 12
        run: |
          build=.local/build/macos-static
          status=0
          sh tests/visual/posix_startup_cocoa.sh "$build/termole" "$build/macos_window_driver" \
            "$build/standalone/t1" || status=1
          for scenario in t2 t3 t4 t5; do
            python3 tests/visual/posix_scenarios_cocoa.py "$scenario" "$build/termole" \
              "$build/macos_window_driver" "$build/standalone/$scenario" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-terminal-pixels
          include-hidden-files: true
          path: |
            .local/build/macos-static/termole-*.bmp
            .local/build/macos-static/standalone/

  windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-mingw
            quickjs: 'OFF'
          - preset: windows-mingw-release
            quickjs: 'ON'
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: make mingw-w64-x86_64-gcc
      - name: Configure
        run: |
          export MINGW_PREFIX="$(cygpath -m /mingw64)"
          cmake --preset "${{ matrix.preset }}" -DTERMOLE_WITH_QUICKJS=${{ matrix.quickjs }}
      - run: cmake --build --preset "${{ matrix.preset }}" --parallel
      - run: ctest --preset "${{ matrix.preset }}" --output-on-failure
      - name: Default Windows shell clipboard round trip
        if: matrix.preset == 'windows-mingw'
        shell: powershell
        run: |
          tests/visual/standalone-clipboard.ps1 -Termole .local/build/mingw-debug/bin/termole.exe -Artifacts .local/build/mingw-debug/tests/visual/standalone-clipboard
      - uses: actions/upload-artifact@v4
        if: always() && matrix.preset == 'windows-mingw'
        with:
          name: windows-standalone-clipboard
          include-hidden-files: true
          path: |
            .local/build/mingw-debug/tests/visual/standalone-clipboard/*/*.png
            .local/build/mingw-debug/tests/visual/standalone-clipboard/*/*.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-${{ matrix.preset }}-test-artifacts
          include-hidden-files: true
          path: |
            .local/build/mingw-*/Testing/Temporary/LastTest.log
            .local/build/mingw-*/tests/visual/**/*.png
            .local/build/mingw-*/tests/sdk-consumer/artifacts/
